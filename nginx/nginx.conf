# Rate limiting zones
limit_req_zone  $binary_remote_addr zone=api_limit:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=global_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen 80;
    server_name app1.local app2.local localhost;
    return 301 https://$host$request_uri;
}

# ── app1.local — HTTPS ───────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name app1.local;

    ssl_certificate     /etc/nginx/certs/app1.crt;
    ssl_certificate_key /etc/nginx/certs/app1.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Rate limiting
    limit_req  zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 20;

    location / {
        proxy_pass         http://app-one:5001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── app2.local — HTTPS ───────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name app2.local;

    ssl_certificate     /etc/nginx/certs/app2.crt;
    ssl_certificate_key /etc/nginx/certs/app2.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;

    limit_req  zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 20;

    location / {
        proxy_pass         http://app-two:5002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── localhost — path-based routing ───────────────────────────────────
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/app1.crt;
    ssl_certificate_key /etc/nginx/certs/app1.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    limit_req zone=global_limit burst=50 nodelay;

    # Route /api/v1/* → app-one
    location /api/v1/ {
        proxy_pass http://app-one:5001/;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route /api/v2/* → app-two
    location /api/v2/ {
        proxy_pass http://app-two:5002/;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit test endpoint
    location /rate-test {
        limit_req  zone=api_limit burst=5 nodelay;
        proxy_pass http://app-one:5001/;
    }
}
